<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Equipos de Cómputo - TI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header no-print">
  <h1>Control de Equipos de Cómputo — Departamento de TI</h1>
  <div class="header-actions">
    <button id="btnNuevo" class="btn btn-primary">+ Nuevo registro</button>
  </div>
</header>

<main class="no-print">
  <section class="toolbar">
    <input type="text" id="buscador" placeholder="Buscar por empleado, equipo, código, serial...">
    <select id="filtroStatus">
      <option value="">Todos los status</option>
      <option value="Entrega de Equipo">Entrega de Equipo</option>
      <option value="Recepción de Equipo">Recepción de Equipo</option>
      <option value="En Reparación">En Reparación</option>
      <option value="De Baja">De Baja</option>
    </select>
  </section>

  <section id="listado" class="listado"></section>
</main>

<!-- Modal de formulario -->
<div id="modalOverlay" class="modal-overlay no-print">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitulo">Nuevo registro de equipo</h2>
      <button id="btnCerrarModal" class="btn-close">&times;</button>
    </div>
    <form id="formEquipo" class="modal-body">
      <input type="hidden" id="id">

      <fieldset>
        <legend>Datos generales del formulario</legend>
        <div class="grid grid-4">
          <label>Empresa
            <input type="text" id="empresa" value="RIOL S.A." required>
          </label>
          <label>Departamento
            <input type="text" id="departamentoTI" value="Departamento de Tecnología de Información TI" required>
          </label>
          <label>Fecha de Registro
            <input type="datetime-local" id="fechaRegistro" required>
          </label>
          <label>No. Forma
            <input type="text" id="numeroForma" placeholder="Forma-TI-001" required>
          </label>
        </div>
        <div class="grid grid-3">
          <label>Status de Equipo
            <select id="statusEquipo" required>
              <option value="Entrega de Equipo">Asignada &gt; Entrega de Equipo</option>
              <option value="Recepción de Equipo">Recepción de Equipo</option>
              <option value="En Reparación">En Reparación</option>
              <option value="De Baja">De Baja</option>
            </select>
          </label>
          <label>Código Empleado
            <input type="text" id="codigoEmpleado" required>
          </label>
          <label>DPI / No. Pasaporte
            <input type="text" id="dpi">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Identificación del equipo en red</legend>
        <div class="grid grid-3">
          <label>Nombre Equipo en Red
            <input type="text" id="nombreEquipoRed" required>
          </label>
          <label>Id de Equipo
            <input type="text" id="idEquipo">
          </label>
          <label>UUID
            <input type="text" id="uuid">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Usuario asignado</legend>
        <div class="grid grid-2">
          <label>Usuario de Dominio
            <input type="text" id="usuarioDominio">
          </label>
          <label>Nombre de Usuario
            <input type="text" id="nombreUsuario" required>
          </label>
          <label>Dominio
            <input type="text" id="dominio">
          </label>
          <label>Correo de Usuario
            <input type="email" id="correoUsuario">
          </label>
          <label>Ubicación
            <input type="text" id="ubicacion">
          </label>
          <label>Departamento
            <input type="text" id="departamentoUsuario">
          </label>
          <label>Unidad de Negocio
            <input type="text" id="unidadNegocio">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Especificaciones del equipo</legend>
        <div class="grid grid-3">
          <label>Tipo de Equipo
            <select id="tipoEquipo">
              <option>Laptop</option>
              <option>Desktop</option>
              <option>Tablet</option>
              <option>Otro</option>
            </select>
          </label>
          <label>Marca de Equipo
            <input type="text" id="marcaEquipo">
          </label>
          <label>Modelo Equipo
            <input type="text" id="modeloEquipo">
          </label>
          <label>Memoria RAM (GB)
            <input type="number" id="memoriaRam">
          </label>
          <label>Tamaño Disco (GB)
            <input type="number" step="0.01" id="tamanoDisco">
          </label>
          <label>Service Tag
            <input type="text" id="serviceTag">
          </label>
          <label>Descripción Procesador
            <input type="text" id="procesador">
          </label>
          <label>Monitor
            <input type="text" id="monitor">
          </label>
          <label>Activo Fijo
            <input type="text" id="activoFijo">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Impresora / Dispositivo asignado (opcional)</legend>
        <div class="grid grid-3">
          <label>Datos Impresora Asig.
            <input type="text" id="datosImpresora" placeholder="N/A">
          </label>
          <label>Serial Impresora Asig.
            <input type="text" id="serialImpresora" placeholder="N/A">
          </label>
          <label>Tipo Impresora Asig.
            <input type="text" id="tipoImpresora" placeholder="N/A">
          </label>
          <label>IP Impresora Asig.
            <input type="text" id="ipImpresora" placeholder="N/A">
          </label>
          <label>Nombre Dispositivo
            <input type="text" id="nombreDispositivo" placeholder="N/A">
          </label>
          <label>Serial Dispositivo
            <input type="text" id="serialDispositivo" placeholder="N/A">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Declaración y responsables</legend>
        <div class="grid grid-2">
          <label>Acción
            <select id="accion">
              <option value="Recibo">Recibo</option>
              <option value="Devuelvo">Devuelvo</option>
            </select>
          </label>
          <label>Nombre y firma de Técnico de Soporte
            <input type="text" id="nombreTecnico">
          </label>
          <label>Nombre y firma de Jefe de Operaciones TI
            <input type="text" id="nombreJefe">
          </label>
          <label>Observaciones
            <input type="text" id="observaciones">
          </label>
        </div>
      </fieldset>

      <div class="modal-actions">
        <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Plantilla imprimible -->
<div id="printArea" class="print-only"></div>

<script src="app.js"></script>
</body>
</html>
