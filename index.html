<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario de Equipos de Cómputo - TI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header no-print">
  <h1>Inventario de Equipos de Cómputo — TI</h1>
  <div class="header-actions">
    <span id="contadorTotal" class="contador"></span>
    <button id="btnGenerarActa" class="btn btn-outline-header">🖶 Generar Acta</button>
    <button id="btnNuevo" class="btn btn-primary">+ Nuevo equipo</button>
  </div>
</header>

<main class="no-print">
  <section class="toolbar">
    <input type="text" id="buscador" placeholder="Buscar por nombre en red, empleado, serial, inventario, modelo...">
    <select id="filtroEmpresa"><option value="">Todas las empresas</option></select>
    <select id="filtroStatus"><option value="">Todos los status</option></select>
    <select id="filtroTipo"><option value="">Todos los tipos</option></select>
  </section>

  <section class="tabla-wrap">
    <table class="tabla">
      <thead>
        <tr>
          <th>Nombre en Red</th>
          <th>Status</th>
          <th>Nombre de Empleado</th>
          <th>Empresa</th>
          <th>Departamento</th>
          <th>Fabricante</th>
          <th>Modelo</th>
          <th>Serial</th>
          <th>No. Inventario</th>
          <th>Ubicación</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbodyEquipos"></tbody>
    </table>
  </section>

  <section class="paginacion">
    <button id="btnPrimero">&laquo;</button>
    <button id="btnAnterior">&lsaquo;</button>
    <span id="infoPagina"></span>
    <button id="btnSiguiente">&rsaquo;</button>
    <button id="btnUltimo">&raquo;</button>
  </section>
</main>

<!-- Modal de formulario -->
<div id="modalOverlay" class="modal-overlay no-print">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitulo">Nuevo equipo</h2>
      <div class="modal-header-actions">
        <button type="button" id="btnImprimirDesdeModal" class="btn btn-outline" title="Imprimir acta de entrega">Imprimir acta</button>
        <button id="btnCerrarModal" class="btn-close">&times;</button>
      </div>
    </div>
    <form id="formEquipo" class="modal-body">
      <input type="hidden" id="id">

      <div class="glpi-grid">
        <div class="glpi-col">
          <div class="glpi-row">
            <label for="nombreRed">Nombre en Red</label>
            <input type="text" id="nombreRed" required>
          </div>
          <div class="glpi-row">
            <label for="ubicaciones">Ubicaciones <span class="lock">&#128274;</span></label>
            <input type="text" id="ubicaciones" list="dl-ubicaciones">
            <datalist id="dl-ubicaciones"></datalist>
          </div>
          <div class="glpi-row">
            <label for="entidad">Entidad</label>
            <input type="text" id="entidad" value="Root Entity">
          </div>
          <div class="glpi-row">
            <label for="empresa">Empresa <span class="lock">&#128274;</span></label>
            <input type="text" id="empresa" list="dl-empresa" required>
            <datalist id="dl-empresa"></datalist>
          </div>
          <div class="glpi-row">
            <label for="nombreEmpleado">Nombre de empleado <span class="lock">&#128274;</span></label>
            <input type="text" id="nombreEmpleado">
          </div>
          <div class="glpi-row">
            <label for="usuarioDominio">Usuario de Dominio <span class="lock">&#128274;</span></label>
            <input type="text" id="usuarioDominio">
          </div>
          <div class="glpi-row">
            <label for="departamento">Departamento <span class="lock">&#128274;</span></label>
            <input type="text" id="departamento" list="dl-departamento">
            <datalist id="dl-departamento"></datalist>
          </div>
          <div class="glpi-row">
            <label for="unidadNegocio">Unidad de Negocio</label>
            <input type="text" id="unidadNegocio" list="dl-unidadNegocio">
            <datalist id="dl-unidadNegocio"></datalist>
          </div>
          <div class="glpi-row">
            <label for="codigoEmpleado">Código de empleado</label>
            <input type="text" id="codigoEmpleado">
          </div>
          <div class="glpi-row">
            <label for="tipoUsuario">Tipo de Usuario</label>
            <input type="text" id="tipoUsuario" placeholder="Estándar &gt; Dominio">
          </div>
          <div class="glpi-row glpi-row-textarea">
            <label for="comentarios">Comentarios</label>
            <textarea id="comentarios" rows="3"></textarea>
          </div>
        </div>

        <div class="glpi-col">
          <div class="glpi-row">
            <label for="status">Status <span class="lock">&#128274;</span></label>
            <input type="text" id="status" list="dl-status">
            <datalist id="dl-status"></datalist>
          </div>
          <div class="glpi-row">
            <label for="tipoEquipo">Tipos de computadores</label>
            <input type="text" id="tipoEquipo" list="dl-tipoEquipo">
            <datalist id="dl-tipoEquipo"></datalist>
          </div>
          <div class="glpi-row">
            <label for="fabricante">Fabricantes</label>
            <input type="text" id="fabricante" list="dl-fabricante">
            <datalist id="dl-fabricante"></datalist>
          </div>
          <div class="glpi-row">
            <label for="modelo">Modelo</label>
            <input type="text" id="modelo">
          </div>
          <div class="glpi-row">
            <label for="numeroSerial">Número de serial</label>
            <input type="text" id="numeroSerial">
          </div>
          <div class="glpi-row">
            <label for="numeroInventario">Número de inventario <span class="lock">&#128274;</span></label>
            <input type="text" id="numeroInventario">
          </div>
          <div class="glpi-row">
            <label for="correo">Correo</label>
            <input type="email" id="correo">
          </div>
          <div class="glpi-row">
            <label for="idGlpi">Id de Equipo</label>
            <input type="text" id="idGlpi">
          </div>
          <div class="glpi-row">
            <label for="uuid">UUID</label>
            <input type="text" id="uuid">
          </div>
          <div class="glpi-row">
            <label for="dpi">DPI / Pasaporte <span class="lock">&#128274;</span></label>
            <input type="text" id="dpi">
          </div>
          <div class="glpi-row">
            <label for="ip">IP del equipo</label>
            <input type="text" id="ip">
          </div>
          <div class="glpi-row">
            <label for="ipImpresora">IP de impresora</label>
            <input type="text" id="ipImpresora" placeholder="N/A">
          </div>
          <div class="glpi-row">
            <label for="dominio">Dominio</label>
            <input type="text" id="dominio">
          </div>
        </div>
      </div>

      <details class="tecnico-detalle">
        <summary>Información técnica adicional</summary>
        <div class="glpi-grid">
          <div class="glpi-col">
            <div class="glpi-row"><label for="procesador">Procesador</label><input type="text" id="procesador"></div>
            <div class="glpi-row"><label for="memoria">Memoria</label><input type="text" id="memoria"></div>
            <div class="glpi-row"><label for="tipoDisco">Tipo de disco duro</label><input type="text" id="tipoDisco"></div>
            <div class="glpi-row"><label for="firmwareInventario">Firmware: No. inventario</label><input type="text" id="firmwareInventario"></div>
          </div>
          <div class="glpi-col">
            <div class="glpi-row"><label for="soVersion">Sistema operativo - Versión</label><input type="text" id="soVersion"></div>
            <div class="glpi-row"><label for="soNucleo">SO - Versión del núcleo</label><input type="text" id="soNucleo"></div>
            <div class="glpi-row"><label for="soSerial">SO - Número de serial</label><input type="text" id="soSerial"></div>
            <div class="glpi-row"><label for="subentidades">Subentidades</label><input type="text" id="subentidades"></div>
            <div class="glpi-row"><label for="proyecto">Proyecto</label><input type="text" id="proyecto"></div>
          </div>
        </div>
      </details>

      <details class="tecnico-detalle" open>
        <summary>Monitor, disco e impresora/dispositivo asignado (para el Acta)</summary>
        <div class="glpi-grid">
          <div class="glpi-col">
            <div class="glpi-row"><label for="monitor">Monitor</label><input type="text" id="monitor" placeholder="N/A"></div>
            <div class="glpi-row"><label for="tamanoDisco">Tamaño Disco (GB)</label><input type="text" id="tamanoDisco" placeholder="N/A"></div>
            <div class="glpi-row"><label for="datosImpresora">Datos Impresora Asig.</label><input type="text" id="datosImpresora" placeholder="N/A"></div>
            <div class="glpi-row"><label for="serialImpresora">Serial Impresora Asig.</label><input type="text" id="serialImpresora" placeholder="N/A"></div>
          </div>
          <div class="glpi-col">
            <div class="glpi-row"><label for="tipoImpresora">Tipo Impresora Asig.</label><input type="text" id="tipoImpresora" placeholder="N/A"></div>
            <div class="glpi-row"><label for="nombreDispositivo">Nombre Dispositivo</label><input type="text" id="nombreDispositivo" placeholder="N/A"></div>
            <div class="glpi-row"><label for="serialDispositivo">Serial Dispositivo</label><input type="text" id="serialDispositivo" placeholder="N/A"></div>
          </div>
        </div>
      </details>

      <div class="modal-actions">
        <button type="button" id="btnEliminarModal" class="btn btn-danger">Eliminar</button>
        <div class="modal-actions-right">
          <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Modal de generación rápida de Acta -->
<div id="modalActaOverlay" class="modal-overlay no-print">
  <div class="modal modal-acta">
    <div class="modal-header">
      <h2>Generar Acta de Entrega/Devolución</h2>
      <button id="btnCerrarModalActa" class="btn-close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="glpi-row glpi-row-ancho">
        <label for="actaNombreRed">Nombre en Red del equipo</label>
        <input type="text" id="actaNombreRed" list="dl-nombreRedActa" placeholder="Escribe o selecciona el nombre en red...">
        <datalist id="dl-nombreRedActa"></datalist>
      </div>
      <p id="actaEstado" class="acta-estado"></p>

      <div class="glpi-grid">
        <div class="glpi-col">
          <div class="glpi-row">
            <label for="actaAccion">Acción</label>
            <select id="actaAccion">
              <option value="Entrega">Entrega de Equipo</option>
              <option value="Devolucion">Devolución de Equipo</option>
            </select>
          </div>
          <div class="glpi-row">
            <label for="actaDeclarante">Nombre de quien recibe/entrega</label>
            <input type="text" id="actaDeclarante">
          </div>
        </div>
        <div class="glpi-col">
          <div class="glpi-row">
            <label for="actaTecnico">Técnico de Soporte</label>
            <input type="text" id="actaTecnico">
          </div>
          <div class="glpi-row">
            <label for="actaJefe">Jefe de Operaciones TI</label>
            <input type="text" id="actaJefe">
          </div>
        </div>
      </div>
      <div class="glpi-row glpi-row-ancho glpi-row-textarea">
        <label for="actaObservaciones">Observaciones</label>
        <textarea id="actaObservaciones" rows="2"></textarea>
      </div>

      <div class="modal-actions">
        <span></span>
        <div class="modal-actions-right">
          <button type="button" id="btnCancelarActa" class="btn btn-secondary">Cancelar</button>
          <button type="button" id="btnGenerarEImprimir" class="btn btn-primary">Generar e Imprimir</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Plantilla imprimible -->
<div id="printArea" class="print-only"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
